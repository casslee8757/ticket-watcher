name: Bruno Mars seat watcher

on:
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a Telegram test notification too"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bruno-mars-seat-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Find installed Chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium found on runner" >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "Using $CHROME"

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_NOTIFICATION: ${{ github.event.inputs.test_notification || 'false' }}
        run: node watcher.mjs

      - name: Save watcher state
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- state.json; then
            echo "No state change to save."
            exit 0
          fi
          git config user.name "Bruno Seat Watcher"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git commit -m "Update watcher state [skip ci]"
          git push
